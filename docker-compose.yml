# docker-compose-bypass.yml
# Direct connection test - NO SIMULATOR

services:
  server:
    image: ${SERVER}
    container_name: server_direct
    hostname: server
    stdin_open: true
    tty: true
    volumes:
      - ${CERTS}:/certs:ro
    environment:
      - ROLE=server
      - TRANSFER_DURATION=${TRANSFER_DURATION:-10}
      - SSLKEYLOGFILE=/logs/keys.log
    cap_add:
      - NET_ADMIN
    networks:
      directnet:
        ipv4_address: 10.0.0.2
    extra_hosts:
      - "server4:10.0.0.2"
      - "server6:::1"

  client:
    image: ${CLIENT}
    container_name: client_direct
    hostname: client
    stdin_open: true
    tty: true
    volumes:
      - ${CERTS}:/certs:ro
    environment:
      - ROLE=client
      - TRANSFER_DURATION=${TRANSFER_DURATION:-10}
      - SSLKEYLOGFILE=/logs/keys.log
    depends_on:
      - server
    cap_add:
      - NET_ADMIN
    networks:
      directnet:
        ipv4_address: 10.0.0.3
    extra_hosts:
      - "server4:10.0.0.2"
      - "server6:::1"

networks:
  directnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
        - subnet: 10.0.0.0/24