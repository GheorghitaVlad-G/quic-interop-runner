user root;
worker_processes auto;
error_log /logs/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /logs/access.log;
    
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    
    server {
        listen 80 default_server reuseport;
        listen [::]:80 default_server reuseport;
        
        server_name _;
        root /www;
        
        # Regular file serving
        location / {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            
            types {
                application/octet-stream *;
            }
            
            client_max_body_size 0;
            allow all;
        }
        
        # Streaming endpoint - generates infinite 0xaa pattern
        location /stream {
            # Use Perl module to generate streaming data
            # This requires nginx-extras package, but we'll use a simpler approach
            
            # Alternative: serve /dev/zero wrapped with a Lua script
            # For now, serve a very large pre-generated file if it exists
            # Or use a simple CGI script
            
            # Simpler approach: serve a large file from /tmp
            alias /tmp/stream_data;
            
            # Disable buffering for true streaming
            proxy_buffering off;
            tcp_nodelay on;
            sendfile off;
        }
    }
}